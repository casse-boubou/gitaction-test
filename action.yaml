name: "Docker Check"
author: "XXXXXXXXXXXX"
description: "XXXXXXXXXXXX"
inputs:
  dockerfile:
    description: "Path for the Dockerfile to analyse"
    required: true
    default: ""
branding:
  # icon: "terminal"
  # color: "gray-dark"
  icon: 'code'
  color: 'yellow'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      name: Install python
      with:
        python-version: '3.14'

    - name: Install python requirements
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "${{ github.action_path }}/src/requirements.txt"

    - name: Install syft
      shell: bash
      run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

    - name: print directory
      shell: bash
      run: ls -l $GITHUB_ACTION_PATH

    - name: print directory
      shell: bash
      run: ls -l /home/runner/work/_temp/_runner_file_commands/add_path*

    - name: Run the check
      id: check
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
      run: python "${{ github.action_path }}/src/main.py" "$GITHUB_WORKSPACE/${{ inputs.dockerfile }}"

    - name: Exit action
      shell: bash
      run: exit ${{steps.check.outputs.statuscode}}
