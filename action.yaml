name: "Docker Pinned Package Checker"
author: "XXXXXXXXXXXX"
description: "Scans a Dockerfile for packages pinned to a fixed version and fails the workflow if a newer version is available in the base image's official Debian, Ubuntu, Alpine, ... repository."
inputs:
  dockerfile:
    description: "Path, relative to the repository root ($GITHUB_WORKSPACE), of the Dockerfile to analyse."
    required: true
    default: ""
  allow_outdated_for:
    description: "Optional whitelist of distribution/version pairs for which only produce a warning instead of failing. A dict-literal string mapping name to a list of versions, e.g. \"{'debian': ['12'], 'alpine': ['3.23']}\". (default: empty)"
    required: false
    default: ""
branding:
  icon: 'search'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      name: Install python
      with:
        python-version: '3.14'

    - name: Install python requirements
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "${{ github.action_path }}/src/requirements.txt"

    - name: Install syft
      shell: bash
      run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

    - name: Run the check
      id: check
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        ALLOW_OUTDATED_FOR: ${{ inputs.allow_outdated_for }}
      run: python "${{ github.action_path }}/src/main.py" "$GITHUB_WORKSPACE/$DOCKERFILE"
